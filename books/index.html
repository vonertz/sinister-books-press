<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Books from Sinister Books Press, including the Snowblind Series, standalone fiction and Amazing Arya's Adventures."
  >

  <title>Books | Sinister Books Press</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f1f1f1;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
    }

    /* NAVIGATION */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.98);
      border-bottom: 1px solid #292929;
    }

    .nav-inner {
      max-width: 1200px;
      min-height: 66px;
      margin: auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: white;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #bbb;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-size: 12px;
    }

    .nav-links a:hover,
    .nav-links .active {
      color: white;
    }

    .menu-button {
      display: none;
      width: 46px;
      height: 42px;
      color: white;
      background: transparent;
      border: 1px solid #444;
      font-size: 24px;
      cursor: pointer;
    }

    /* HEADER */

    .page-header {
      padding: 78px 24px 72px;
      background:
        radial-gradient(
          circle at center,
          #242424 0%,
          #101010 48%,
          #050505 84%
        );
      border-bottom: 1px solid #242424;
    }

    .page-header-inner {
      max-width: 1100px;
      margin: auto;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
    }

    h1 {
      margin-bottom: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 8vw, 74px);
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .page-header p {
      max-width: 760px;
      color: #aaa;
      font-size: 18px;
    }

    /* GENERAL */

    section {
      padding: 78px 24px;
    }

    .section-inner {
      max-width: 1150px;
      margin: auto;
    }

    .alternate {
      background: #101010;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
    }

    h2 {
      margin-bottom: 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 6vw, 48px);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .intro {
      max-width: 780px;
      color: #999;
      font-size: 16px;
    }

    /* PROMO */

    .series-promo {
      margin-top: 38px;
    }

    .series-promo img {
      display: block;
      width: 100%;
      max-width: 950px;
      margin: auto;
      border: 1px solid #292929;
      box-shadow: 0 18px 45px rgba(0,0,0,0.4);
    }

    /* BOOK GRIDS */

    .book-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      margin-top: 42px;
    }

    .book-card {
      overflow: hidden;
      background: #0d0d0d;
      border: 1px solid #292929;
      display: flex;
      flex-direction: column;
    }

    .book-image-wrap {
      padding: 16px;
      background: #111;
      border-bottom: 1px solid #242424;
    }

    .book-card img {
      display: block;
      width: 100%;
      height: 390px;
      object-fit: contain;
      margin: auto;
    }

    .book-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .status {
      display: inline-block;
      align-self: flex-start;
      margin-bottom: 12px;
      padding: 5px 9px;
      background: #1b1b1b;
      border: 1px solid #343434;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 9px;
      font-weight: bold;
    }

    .status.available {
      color: #eee;
      border-color: #555;
    }

    .status.soon {
      color: #ccc;
      border-color: #555;
    }

    .status.development {
      color: #999;
      border-color: #3b3b3b;
    }

    .book-content h3 {
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      line-height: 1.25;
    }

    .book-content p {
      margin-bottom: 22px;
      color: #999;
      font-size: 14px;
      flex: 1;
    }

    .button {
      display: inline-block;
      align-self: flex-start;
      padding: 11px 16px;
      color: #050505;
      background: white;
      border: 1px solid white;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-size: 10px;
      font-weight: bold;
    }

    .button:hover {
      color: white;
      background: #181818;
    }

    .secondary-button {
      color: white;
      background: transparent;
      border-color: #555;
    }

    /* SILVER KITE */

    .development
